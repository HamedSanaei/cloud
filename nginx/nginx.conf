# Production nginx configuration for tofan-cloud.
# Serves the Vite/React SPA with BrowserRouter SPA fallback.
#
# NOTE: This container binds only to the local machine (via docker compose on
# 127.0.0.1). The external facing TLS/reverse-proxy terminates in the host
# ingress (nginx/Caddy/Traefik) in front of Cloudflare.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Health check — nothing else should touch this location.
    # Returns HTTP 200 with a tiny plain-text body.
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ------------------------------------------------------------------
    # Hashed static assets (JS/CSS/woff/woff2/svg/png/jpg, etc.).
    # Vite emits content-hashed filenames (index-<hash>.js), so these can
    # be cached for one year and remain immutable. A new deploy ships new
    # filenames, and index.html (never cached long) references them.
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # index.html (the application shell) must NOT be cached long.
    # New deployments become visible immediately on the next request.
    # ------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
        etag on;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # SPA fallback — React BrowserRouter routes (e.g. /dashboard) must
    # serve index.html so the client-side router can render the page.
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # Security headers (safe for this static frontend).
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Note: no CSP block here — the app may load external font resources;
    # tightening CSP would require it be validated against the built output.

    # Basic hardening
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}