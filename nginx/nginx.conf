# Production nginx configuration for tofan-cloud.
# Serves the Vite/React SPA with BrowserRouter SPA fallback.
#
# NOTE: This container binds only to the local machine (via docker compose on
# 127.0.0.1). The external facing TLS/reverse-proxy terminates in the host
# ingress (nginx/Caddy/Traefik) in front of Cloudflare.

# This inner listener is loopback-only behind the host ingress. The ingress
# must overwrite X-Forwarded-Proto using its trusted edge/client protocol.
map $http_x_forwarded_proto $public_scheme { default $scheme; https https; http http; }
map $http_x_forwarded_proto $public_http { default 0; http 1; }

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    if ($public_http) { return 308 https://parserver.ir$request_uri; }
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex,follow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }


    # ------------------------------------------------------------------
    # Health check — nothing else should touch this location.
    # Returns HTTP 200 with a tiny plain-text body.
    # ------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Domain verification must serve the actual empty file, never the SPA shell.
    location = /5138023.txt {
        default_type text/plain;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Hashed static assets (JS/CSS/woff/woff2/svg/png/jpg, etc.).
    # Vite emits content-hashed filenames (index-<hash>.js), so these can
    # be cached for one year and remain immutable. A new deploy ships new
    # filenames, and index.html (never cached long) references them.
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # index.html (the application shell) must NOT be cached long.
    # New deployments become visible immediately on the next request.
    # ------------------------------------------------------------------
    location = /index.html {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires -1;
        etag on;
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Backend API — proxied to the internal cloud-api container. The API is
    # never reachable directly from the public internet; only this nginx
    # (inside the compose network) can talk to it. Docker DNS is re-resolved
    # per request so api restarts don't break routing.
    # ------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Every visitor gets the same public HTML. Fetch the latest published
    # prices internally, without forwarding any session or query parameters.
    location = / {
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /home.html =404;
    }
    location = /hetzner {
        ssi on;
        ssi_silent_errors on;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /hetzner.html =404;
    }
    location = /hetzner/ { return 308 https://parserver.ir/hetzner$is_args$args; }
    location = /home.html { return 404; }
    location = /hetzner.html { return 404; }
    location ~ /\. { return 404; }
    location = /robots.txt { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }
    location = /_home-tariffs {
        internal;
        set $cloud_api http://cloud-api:8000;
        proxy_pass $cloud_api/api/public/home-tariffs;
        proxy_pass_request_headers off;
        proxy_set_header Host cloud-api;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = @home_tariffs_unavailable;
    }
    location = /_hetzner-tariffs {
        internal;
        set $cloud_api http://cloud-api:8000;
        proxy_pass $cloud_api/api/public/home-tariffs?scope=hetzner;
        proxy_pass_request_headers off;
        proxy_set_header Host cloud-api;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 429 500 502 503 504 = @home_tariffs_unavailable;
    }
    # Non-2xx lets SSI render its explicit readable stub, rather than an empty 204.
    location @home_tariffs_unavailable { return 503; }

    # Authenticated, one-use console grants; no public provider URL is exposed.
    location ~ ^/api/(v1/)?servers/[a-f0-9-]+/console/[a-f0-9-]+$ {
        set $cloud_api http://cloud-api:8000;
        proxy_pass $cloud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    # Only sealed, authenticated system uploads get a larger body allowance.
    # The backend authenticates onRequest before buffering the binary body.
    location ~ ^/api/(v1/)?admin/settings/backups/upload$ {
        set $cloud_api http://cloud-api:8000;
        proxy_pass $cloud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;
        client_max_body_size 65m;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_no_cache 1;
        add_header Cache-Control "no-store" always;
    }
    location /api/ {
        set $cloud_api http://cloud-api:8000;
        proxy_pass $cloud_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 256k;
        # API responses are JSON — never cache them here.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # ------------------------------------------------------------------
    # SPA fallback — React BrowserRouter routes (e.g. /dashboard) must
    # serve index.html so the client-side router can render the page.
    # ------------------------------------------------------------------
    # Only actual SPA route shapes get the private, noindex shell. Entity access
    # and existence are still checked by the authenticated backend.
    location ~ "^/(login|register|forgot-password|auth/callback|dashboard|platform|tickets|wallet|invoices|charge-requests|servers(/(create|[a-zA-Z0-9_-]{1,200}))?|ips|traffic-packages|domains(/register)?|profile/update|sessions|settings(/(telegram|platform-admin))?|changelog|guard-preview|admin(/(orders(/[a-zA-Z0-9_-]{1,200})?|users(/[a-zA-Z0-9_-]{1,200}(/servers)?)?|servers(/[a-zA-Z0-9_-]{1,200})?|datacenters|tickets|settings(/(outbound|primary-ipv4|hetzner-margin|sms|iran-tariffs|gateway|logs|backups|finance))?))?)$" {
        try_files /index.html =404;
        add_header X-Robots-Tag "noindex,follow" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # Security headers (safe for this static frontend).
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Note: no CSP block here — the app may load external font resources;
    # tightening CSP would require it be validated against the built output.

    # Basic hardening
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}
