<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>انتقال امن به درگاه پرداخت | پارس سرور</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fa; color: #172b4d; font-family: Tahoma, sans-serif; }
    main { background: #fff; margin: 20px; padding: 28px; border: 1px solid #dde5f1; border-radius: 14px; text-align: center; max-width: 440px; line-height: 2; }
    a { display: inline-block; background: #2869e8; border-radius: 9px; padding: 7px 22px; color: #fff; text-decoration: none; }
    a[hidden] { display: none; }
  </style>
  <script src="/payment-continue.js" defer></script>
</head>
<body>
  <main>
    <h1>در حال انتقال به درگاه پرداخت</h1>
    <p id="status" role="status">در حال آماده‌سازی انتقال امن از دامنه پارس‌سرور…</p>
    <a id="continue" hidden referrerpolicy="origin">ادامه پرداخت</a>
    <p><a href="/wallet">بازگشت به کیف پول</a></p>
    <noscript>برای انتقال به درگاه باید جاوااسکریپت مرورگر فعال باشد.</noscript>
  </main>
</body>
</html>
