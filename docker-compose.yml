name: tofan-cloud

# =============================================================================
# tofan-cloud — production deployment of the Cloud Server platform.
#
# Topology (all internal except the frontend):
#   cloud        nginx SPA + /api proxy   -> binds 127.0.0.1:${CLOUD_PORT}
#   cloud-api    Fastify API              -> internal network only
#   cloud-worker BullMQ worker            -> internal network only
#   cloud-postgres PostgreSQL             -> internal network only
#   cloud-redis  Redis (BullMQ)           -> internal network only
#
# Public path: Cloudflare -> host ingress -> 127.0.0.1:${CLOUD_PORT} -> nginx
#   -> /api/* to cloud-api:8000 (internal). No service is exposed publicly.
#
# Secrets (DATABASE_URL, AUTH_SECRET, LEASEWEB_API_KEY, ...) come from the
# server-side /opt/tofan/cloud/.env — never from the repository.
#
# Images:
#   IMAGE_SHA       web frontend image (e.g. ghcr.io/hamedsanaei/cloud:sha-<sha>)
#   API_IMAGE_SHA   backend image      (e.g. ghcr.io/hamedsanaei/cloud-api:sha-<sha>)
# =============================================================================

services:
  cloud:
    image: ${IMAGE_SHA:?IMAGE_SHA must be set to a full GHCR image tag}
    container_name: tofan-cloud
    restart: unless-stopped
    depends_on:
      cloud-api:
        condition: service_healthy
    networks:
      - tofan-cloud_net
    ports:
      # Bind only to loopback — the host ingress + Cloudflare are the only
      # way the public reaches this container.
      - "127.0.0.1:${CLOUD_PORT:-8540}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID

  cloud-api:
    image: ${API_IMAGE_SHA:?API_IMAGE_SHA must be set to a full GHCR image tag}
    container_name: tofan-cloud-api
    restart: unless-stopped
    depends_on:
      cloud-postgres:
        condition: service_healthy
      cloud-redis:
        condition: service_healthy
    networks:
      - tofan-cloud_net
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set (postgres://...)}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set (redis://...)}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      LEASEWEB_MODE: ${LEASEWEB_MODE:-mock}
      LEASEWEB_API_BASE_URL: ${LEASEWEB_API_BASE_URL:-https://api.leaseweb.com}
      LEASEWEB_API_KEY: ${LEASEWEB_API_KEY:-}
      LEASEWEB_ORDERING_ENABLED: ${LEASEWEB_ORDERING_ENABLED:-false}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-leaseweb}
      QUOTE_TTL_MINUTES: ${QUOTE_TTL_MINUTES:-15}
      RENEWAL_LOOKAHEAD_DAYS: ${RENEWAL_LOOKAHEAD_DAYS:-3}
      RENEWAL_GRACE_DAYS: ${RENEWAL_GRACE_DAYS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cloud-worker:
    image: ${API_IMAGE_SHA:?API_IMAGE_SHA must be set to a full GHCR image tag}
    container_name: tofan-cloud-worker
    restart: unless-stopped
    depends_on:
      cloud-postgres:
        condition: service_healthy
      cloud-redis:
        condition: service_healthy
    networks:
      - tofan-cloud_net
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set (postgres://...)}
      REDIS_URL: ${REDIS_URL:?REDIS_URL must be set (redis://...)}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      LEASEWEB_MODE: ${LEASEWEB_MODE:-mock}
      LEASEWEB_API_BASE_URL: ${LEASEWEB_API_BASE_URL:-https://api.leaseweb.com}
      LEASEWEB_API_KEY: ${LEASEWEB_API_KEY:-}
      LEASEWEB_ORDERING_ENABLED: ${LEASEWEB_ORDERING_ENABLED:-false}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-leaseweb}
      QUOTE_TTL_MINUTES: ${QUOTE_TTL_MINUTES:-15}
      RENEWAL_LOOKAHEAD_DAYS: ${RENEWAL_LOOKAHEAD_DAYS:-3}
      RENEWAL_GRACE_DAYS: ${RENEWAL_GRACE_DAYS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["npm", "run", "start:worker"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cloud-postgres:
    image: postgres:17-alpine
    container_name: tofan-cloud-postgres
    restart: unless-stopped
    networks:
      - tofan-cloud_net
    # NO host port — reachable only inside the compose network.
    environment:
      POSTGRES_USER: cloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: cloud
    volumes:
      - cloud-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloud -d cloud"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  cloud-redis:
    image: redis:7-alpine
    container_name: tofan-cloud-redis
    restart: unless-stopped
    networks:
      - tofan-cloud_net
    # NO host port.
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
        compress: "true"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  cloud-postgres-data:

networks:
  tofan-cloud_net:
    driver: bridge
    name: tofan-cloud_net