# HTTP-only ACME bootstrap. Install ONLY when DNS activation is approved.
# Do not enable alongside parserver.ir.conf (which replaces this file).
# Never serve login/API traffic over plaintext HTTP while TLS is pending.
server {
    listen 80;
    listen [::]:80;
    server_name parserver.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/parserver-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
