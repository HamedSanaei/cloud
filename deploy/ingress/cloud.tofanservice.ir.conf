# ============================================================================
# OPTIONAL — Reverse-proxy virtual host for tofan-cloud.
#
# This is a TEMPLATE for the server's EXISTING ingress (the same nginx that
# already fronts Vendora). It is NOT installed automatically and it is NOT
# part of the Docker image. Do the following on the production server:
#
#   1. Inspect how Vendora is currently exposed (nginx config, ports, certs).
#   2. Adapt this snippet to match YOUR ingress layout, then place it, e.g.:
#        /etc/nginx/sites-available/cloud.tofanservice.ir.conf
#        ln -s /etc/nginx/sites-available/cloud.tofanservice.ir.conf \
#               /etc/nginx/sites-enabled/cloud.tofanservice.ir.conf
#   3. Validate, then RELOAD (never restart the whole server):
#        sudo nginx -t
#        sudo systemctl reload nginx
#
# Do NOT modify the Vendora virtual host.
#
# Architecture (public -> container):
#   Cloudflare -> Host nginx/reverse proxy -> 127.0.0.1:${CLOUD_PORT} -> tofan-cloud
#
# NOTE: replace ${CLOUD_PORT} and the certificate paths with real values.
#       Cloudflare SSL/TLS must be Full (strict) for this origin setup.
# ============================================================================

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cloud.tofanservice.ir;

    # Origin certificate (Full (strict) compatible). Adapt paths as needed.
    ssl_certificate     /etc/letsencrypt/live/cloud.tofanservice.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.tofanservice.ir/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass         http://127.0.0.1:${CLOUD_PORT};
        proxy_http_version 1.1;

        # Preserve client + upstream detail for the origin container/service.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cloud.tofanservice.ir;
    return 301 https://$host$request_uri;
}