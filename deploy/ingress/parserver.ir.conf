# Prepared for the audited Netiran ingress on 213.177.178.82 (2026-11-17).
# Keep public :443 TLS passthrough and the Nginx TLS listener :9443 unchanged.
# The CDN can use HTTP to origin :80; its *trusted* client-protocol header must
# distinguish an HTTPS visitor from HTTP, otherwise a blanket redirect loops.
# Confirm Arvan overwrites X-Forwarded-Proto before activation; prefer enabling
# Force HTTPS at the edge too. No active host configuration is changed by a PR.
# Verify current ranges at https://www.arvancloud.ir/fa/ips.txt before rollout.
geo $realip_remote_addr $parserver_arvan {
    default 0;
    185.143.232.0/22 1;
    188.229.116.16/30 1;
    94.101.182.0/27 1;
    2.144.3.128/28 1;
    37.32.16.0/27 1;
    37.32.17.0/27 1;
    37.32.18.0/27 1;
    37.32.19.0/27 1;
    185.215.232.0/22 1;
    178.131.120.48/28 1;
    94.101.183.0/28 1;
    78.157.36.112/28 1;
    95.38.61.80/28 1;
    193.24.119.0/29 1;
}
map "$parserver_arvan:$http_x_forwarded_proto" $parserver_client_scheme {
    default $scheme;
    "1:https" https;
    "1:http" http;
}
map $uri $parserver_validation {
    default 0;
    ~^/\.well-known/acme-challenge/ 1;
    /5138023.txt 1;
}
map "$parserver_client_scheme:$parserver_validation" $parserver_redirect_http {
    default 0;
    "http:0" 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name parserver.ir;
    client_max_body_size 65m;
    if ($parserver_redirect_http) { return 308 https://parserver.ir$request_uri; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/parserver-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /5138023.txt {
        root /var/www/parserver-verification;
        default_type text/plain;
        add_header X-Robots-Tag "noindex" always;
        try_files $uri =404;
    }
    location ~ ^/api/(v1/)?servers/[a-f0-9-]+/console/[a-f0-9-]+$ {
        proxy_pass http://127.0.0.1:8540;
        proxy_http_version 1.1;
        proxy_set_header Host parserver.ir;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host parserver.ir;
        proxy_set_header X-Forwarded-Proto $parserver_client_scheme;
        proxy_read_timeout 310s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8540;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_set_header Host parserver.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $parserver_client_scheme;
    }
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name parserver.ir;
    client_max_body_size 65m;
    if ($parserver_redirect_http) { return 308 https://parserver.ir$request_uri; }

    ssl_certificate /etc/letsencrypt/live/parserver.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parserver.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Inner API still caps ordinary JSON at 256 KiB.

    location ~ ^/api/(v1/)?servers/[a-f0-9-]+/console/[a-f0-9-]+$ {
        proxy_pass http://127.0.0.1:8540;
        proxy_http_version 1.1;
        proxy_set_header Host parserver.ir;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host parserver.ir;
        proxy_set_header X-Forwarded-Proto $parserver_client_scheme;
        proxy_read_timeout 310s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8540;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host parserver.ir;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $parserver_client_scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
