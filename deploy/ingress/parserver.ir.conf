# Prepared for Nethederland's CURRENT ingress topology:
# public :443 -> existing TLS passthrough -> host Nginx :9443 -> web :8540.
# Do not take over :443 or modify the unrelated passthrough service.
# Enable ONLY after issuance of a real certificate and verification that the
# passthrough carries SNI parserver.ir unchanged to Nginx on :9443.
# Replaces parserver.ir.bootstrap.conf; never enable both HTTP server blocks.
# Keep cloud.tofanservice.ir and unrelated virtual hosts unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name parserver.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/parserver-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://parserver.ir$request_uri;
    }
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name parserver.ir;

    ssl_certificate /etc/letsencrypt/live/parserver.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/parserver.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 65m; # Inner API still caps ordinary JSON at 256 KiB.

    location ~ ^/api/(v1/)?servers/[a-f0-9-]+/console/[a-f0-9-]+$ {
        proxy_pass http://127.0.0.1:8540;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8540;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
