name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Lint, typecheck, build, docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tofan-cloud:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker images -q tofan-cloud:ci | head -n1)"
          [[ -n "$IMAGE_ID" ]] || { echo "::error::image not found"; exit 1; }
          docker rm -f tofan-cloud-ci-smoke >/dev/null 2>&1 || true
          docker run -d --rm --name tofan-cloud-ci-smoke -p 127.0.0.1:8901:80 \
            --security-opt no-new-privileges \
            --cap-drop ALL --cap-add CHOWN --cap-add SETGID \
            "${IMAGE_ID}" >/dev/null
          trap 'docker rm -f tofan-cloud-ci-smoke >/dev/null 2>&1 || true' EXIT
          sleep 3
          echo "--- /healthz ---"
          curl -fsS http://127.0.0.1:8901/healthz
          echo
          echo "--- /dashboard (SPA fallback) HTTP status ---"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8901/dashboard)"
          echo "HTTP $code"
          [[ "$code" == "200" ]] || { echo "::error::SPA route did not return 200"; exit 1; }
          echo "--- /healthz must be the app's, not default nginx ---"
          body="$(curl -s http://127.0.0.1:8901/healthz)"
          [[ "$body" == "ok" ]] || { echo "::error::unexpected /healthz body"; exit 1; }