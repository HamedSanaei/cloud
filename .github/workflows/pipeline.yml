name: Cloud CI and Deployment

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
      confirm_production:
        description: Explicitly approve a Production deployment
        type: boolean
        default: false
      skip_public_healthcheck:
        description: >-
          Skip public health checks. Set to true ONLY for the initial bootstrap
          before DNS/reverse-proxy/Cloudflare are live.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloud-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment-policy:
    name: Validate deployment request
    runs-on: ubuntu-latest
    steps:
      - name: Refuse ambiguous or unapproved manual deployment
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          APPROVED: ${{ inputs.confirm_production }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == workflow_dispatch ]]; then
            case "$TARGET_ENVIRONMENT:$REF:$APPROVED" in
              staging:refs/heads/staging:*) ;;
              production:refs/heads/main:true) ;;
              *) echo "::error::Target branch or explicit Production approval is invalid"; exit 1 ;;
            esac
          fi

  # ==========================================================================
  # JOB 1 — test-build (frontend)
  # Runs for PRs, pushes to main/staging, and workflow_dispatch. Never deploys.
  # ==========================================================================
  test-build:
    name: Test, build, and smoke-test (frontend)
    runs-on: ubuntu-latest
    needs: deployment-policy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate workflows and deployment scripts
        run: |
          command -v shellcheck >/dev/null || { echo "::error::ShellCheck is required"; exit 1; }
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          for script in deploy/scripts/deploy.sh deploy/scripts/server-bootstrap.sh deploy/scripts/status.sh; do
            bash -n "$script"
          done

      - name: Validate recovery target and archive safety
        run: python3 -m unittest discover -s deploy/tests -v

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install shared lint toolchain
        working-directory: backend
        run: npm ci

      - name: Lint frontend with the existing backend toolchain
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image (validation)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: tofan-cloud:ci
          cache-from: type=gha,scope=cloud-web
          cache-to: type=gha,scope=cloud-web,mode=max

      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker images -q tofan-cloud:ci | head -n1)"
          [[ -n "$IMAGE_ID" ]] || { echo "::error::image not found"; exit 1; }
          docker rm -f tofan-cloud-ci-smoke >/dev/null 2>&1 || true
          docker run -d --rm --name tofan-cloud-ci-smoke -p 127.0.0.1:8901:80 \
            --security-opt no-new-privileges \
            --cap-drop ALL --cap-add CHOWN --cap-add SETGID \
            "${IMAGE_ID}" >/dev/null
          trap 'docker rm -f tofan-cloud-ci-smoke >/dev/null 2>&1 || true' EXIT
          sleep 3
          echo "--- /healthz (must be the app's, not default nginx) ---"
          body="$(curl -fsS http://127.0.0.1:8901/healthz)"
          echo "$body"
          [[ "$body" == "ok" ]] || { echo "::error::unexpected /healthz body"; exit 1; }
          echo "--- /dashboard (SPA fallback) HTTP status ---"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8901/dashboard)"
          echo "HTTP $code"
          [[ "$code" == "200" ]] || { echo "::error::SPA route did not return 200"; exit 1; }

  # ==========================================================================
  # JOB 2 — backend-check
  # Runs for PRs and pushes to main/staging, plus manual requests, against
  # ephemeral PostgreSQL + Redis. Never pushes or deploys, and never contacts
  # the real Leaseweb API (mock mode only).
  # ==========================================================================
  backend-check:
    name: Backend typecheck, lint, tests, migrations
    runs-on: ubuntu-latest
    needs: deployment-policy
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloud
          POSTGRES_PASSWORD: cloud
          POSTGRES_DB: cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud -d cloud"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://cloud:cloud@127.0.0.1:5432/cloud
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
      APP_ENV: test
      AUTH_DELIVERY_MODE: log
      LEASEWEB_MODE: mock
      LEASEWEB_ORDERING_ENABLED: "false"
      PLATFORM_API_URL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Unit tests (pricing, money, providers, state machine)
        working-directory: backend
        run: npm run test:unit

      - name: Migration validation (apply migrations to ephemeral PostgreSQL)
        working-directory: backend
        run: npm run db:migrate

      - name: Integration tests (auth, wallets, orders, provisioning, permissions)
        working-directory: backend
        run: npm run test:integration

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build backend image (validation)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: tofan-cloud-api:ci
          cache-from: type=gha,scope=cloud-api
          cache-to: type=gha,scope=cloud-api,mode=max

      - name: Smoke-test backend image (health endpoints)
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker image inspect tofan-cloud-api:ci --format '{{.Id}}')"
          [[ -n "$IMAGE_ID" ]] || { echo "::error::backend image not found"; exit 1; }
          docker rm -f tofan-cloud-api-smoke >/dev/null 2>&1 || true
          docker run -d --name tofan-cloud-api-smoke --network host \
            -e HOST=127.0.0.1 -e PORT=8902 \
            -e NODE_ENV=test -e DATABASE_URL="$DATABASE_URL" -e REDIS_URL="$REDIS_URL" \
            -e AUTH_SECRET=ci-smoke-secret-0123456789abcdef \
            -e LEASEWEB_MODE=mock \
            "${IMAGE_ID}" >/dev/null
          trap 'docker rm -f tofan-cloud-api-smoke >/dev/null 2>&1 || true' EXIT
          ready=0
          for ((attempt=0; attempt<45; attempt++)); do
            if curl -fsS http://127.0.0.1:8902/api/health/ready >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            docker logs tofan-cloud-api-smoke
            echo "::error::backend never became ready against PostgreSQL and Redis"
            exit 1
          fi
          echo "--- /api/health/live ---"
          curl -fsS http://127.0.0.1:8902/api/health/live
          echo
          echo "--- /api/health/ready ---"
          curl -fsS http://127.0.0.1:8902/api/health/ready
          echo

  # ==========================================================================
  # JOB 3 — build-push (web + api images)
  # Runs for pushes to main/staging and workflow_dispatch, never pull requests.
  # Both images use only immutable full-SHA tags; no rolling production alias
  # is changed by staging builds.
  # ==========================================================================
  build-push:
    name: Build & push images to GHCR
    needs: [deployment-policy, test-build, backend-check]
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
      api_image: ${{ steps.image.outputs.api_ref }}
      sha: ${{ steps.image.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR image names must be lowercase. Repo = HamedSanaei/cloud -> hamedsanaei/cloud
      - name: Compute immutable image references
        id: image
        run: |
          REPO_LOWER="${{ github.repository }}"
          REPO_LOWER="${REPO_LOWER,,}"
          SHA="${{ github.sha }}"
          {
            echo "ref=ghcr.io/${REPO_LOWER}:sha-${SHA}"
            echo "api_ref=ghcr.io/${REPO_LOWER}-api:sha-${SHA}"
            echo "sha=${SHA}"
          } >>"$GITHUB_OUTPUT"
          echo "configured web image: ghcr.io/${REPO_LOWER}:sha-${SHA}"
          echo "configured api image: ghcr.io/${REPO_LOWER}-api:sha-${SHA}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR (for push)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.title=tofan-cloud
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cloud-web
          cache-to: type=gha,scope=cloud-web,mode=max

      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.image.outputs.api_ref }}
          labels: |
            org.opencontainers.image.title=cloud-server-backend
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=cloud-api
          cache-to: type=gha,scope=cloud-api,mode=max

  # Staging automatically updates the SAME live runtime after CI.
  # The main release lane remains manual and protected by owner review.
  deploy:
    name: Deploy tested release
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' &&
       ((inputs.environment == 'staging' && github.ref == 'refs/heads/staging') ||
        (inputs.environment == 'production' && github.ref == 'refs/heads/main' && inputs.confirm_production)))
    environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}
    concurrency:
      group: cloud-production-deploy
      cancel-in-progress: false
    env:
      RELEASE_BRANCH: ${{ github.ref_name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      CLOUD_PORT: ${{ vars.CLOUD_PORT }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      RELEASE_SHA: ${{ needs.build-push.outputs.sha }}
    steps:
      - name: Recheck branch HEAD after any Environment approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${RELEASE_BRANCH}" --jq '.object.sha')"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ && "$current" == "$RELEASE_SHA" ]] || {
            echo "::error::Only the tested current branch HEAD may deploy"; exit 1;
          }

      - name: Check out the exact tested release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build-push.outputs.sha }}
          persist-credentials: false

      - name: Validate shared live target and install ephemeral SSH material
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$SSH_KEY" && -n "$KNOWN_HOSTS" ]] || {
            echo "::error::This Environment needs its own DEPLOY_* SSH secrets"; exit 1;
          }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || {
            echo "::error::DEPLOY_PATH must select the existing live website"; exit 1;
          }
          [[ "$CLOUD_PORT" =~ ^[0-9]+$ && "$CLOUD_PORT" -gt 0 && "$CLOUD_PORT" -le 65535 ]] || {
            echo "::error::CLOUD_PORT must be configured for this Environment"; exit 1;
          }
          [[ "$PUBLIC_URL" == https://* ]] || {
            echo "::error::PUBLIC_URL must explicitly name this Environment's HTTPS ingress"; exit 1;
          }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/deploy_key" >/dev/null

      - name: Deliver the complete release script
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          script=".deploy-${RELEASE_SHA}-${GITHUB_RUN_ID}.sh"
          common=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i "$HOME/.ssh/deploy_key")
          ssh "${common[@]}" -p "$port" "$target" "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env'"
          scp "${common[@]}" -P "$port" deploy/scripts/deploy.sh "${target}:${DEPLOY_PATH}/${script}"
          read -r checksum _ < <(sha256sum deploy/scripts/deploy.sh)
          actual="$(ssh "${common[@]}" -p "$port" "$target" "sha256sum '$DEPLOY_PATH/$script'")"
          [[ "${actual%% *}" == "$checksum" ]] || {
            echo "::error::Release script integrity check failed"; exit 1;
          }

      - name: Deploy with ephemeral registry authentication
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE: ${{ needs.build-push.outputs.image }}
          API_IMAGE: ${{ needs.build-push.outputs.api_image }}
          SKIP: ${{ inputs.skip_public_healthcheck }}
        run: |
          set -euo pipefail
          port="${DEPLOY_PORT:-22}"
          target="${DEPLOY_USER}@${DEPLOY_HOST}"
          script="${DEPLOY_PATH}/.deploy-${RELEASE_SHA}-${GITHUB_RUN_ID}.sh"
          skip=0
          [[ "${SKIP:-false}" != true ]] || skip=1
          printf -v invoke 'COMPOSE_DIR=%q CLOUD_PORT=%q RELEASE_SHA=%q API_IMAGE=%q bash %q %q %q %q' \
            "$DEPLOY_PATH" "$CLOUD_PORT" "$RELEASE_SHA" "$API_IMAGE" "$script" "$IMAGE" "$PUBLIC_URL" "$skip"
          printf -v registry "printf '%%s' \"\$registry_token\" | docker login ghcr.io -u %q --password-stdin >/dev/null" "$GHCR_ACTOR"
          printf -v cleanup "rm -rf -- \"\$DOCKER_CONFIG\"; rm -f -- %q" "$script"
          printf -v remote "set -Eeuo pipefail; DOCKER_CONFIG=\"\$(mktemp -d)\"; export DOCKER_CONFIG; trap %q EXIT; IFS= read -r registry_token; %s; unset registry_token GHCR_TOKEN; %s" "$cleanup" "$registry" "$invoke"
          printf '%s\n' "$GHCR_TOKEN" | ssh -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i "$HOME/.ssh/deploy_key" \
            -p "$port" "$target" "$remote"

      - name: Remove ephemeral SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
