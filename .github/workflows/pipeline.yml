name: Cloud Production Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:
    inputs:
      skip_public_healthcheck:
        description: >-
          Skip public health checks. Set to true ONLY for the initial bootstrap
          before DNS/reverse-proxy/Cloudflare are live.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Only ONE production deployment may run at a time. A deployment already
# modifying production must not be interrupted halfway by another push.
concurrency:
  group: cloud-production
  cancel-in-progress: false

jobs:
  # ==========================================================================
  # JOB 1 — test-build
  # Runs for PR, push to main, and workflow_dispatch. Validates the app and
  # the production image. Never pushes or deploys.
  # ==========================================================================
  test-build:
    name: Test, build, and smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (Vite)
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (validation)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tofan-cloud:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          IMAGE_ID="$(docker images -q tofan-cloud:ci | head -n1)"
          [[ -n "$IMAGE_ID" ]] || { echo "::error::image not found"; exit 1; }
          docker rm -f tofan-cloud-ci-smoke >/dev/null 2>&1 || true
          docker run -d --rm --name tofan-cloud-ci-smoke -p 127.0.0.1:8901:80 \
            --security-opt no-new-privileges \
            --cap-drop ALL --cap-add CHOWN --cap-add SETGID \
            "${IMAGE_ID}" >/dev/null
          trap 'docker rm -f tofan-cloud-ci-smoke >/dev/null 2>&1 || true' EXIT
          sleep 3
          echo "--- /healthz (must be the app's, not default nginx) ---"
          body="$(curl -fsS http://127.0.0.1:8901/healthz)"
          echo "$body"
          [[ "$body" == "ok" ]] || { echo "::error::unexpected /healthz body"; exit 1; }
          echo "--- /dashboard (SPA fallback) HTTP status ---"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8901/dashboard)"
          echo "HTTP $code"
          [[ "$code" == "200" ]] || { echo "::error::SPA route did not return 200"; exit 1; }

  # ==========================================================================
  # JOB 2 — build-push
  # Runs ONLY for push to main and workflow_dispatch (never for pull_request).
  # Builds and pushes the immutable SHA image plus a convenience latest tag in
  # one BuildKit operation. Production deploys always use the SHA tag.
  # ==========================================================================
  build-push:
    name: Build & push image to GHCR
    needs: test-build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.image.outputs.ref }}
      sha: ${{ steps.image.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR image names must be lowercase. Repo = HamedSanaei/cloud -> hamedsanaei/cloud
      - name: Compute image references (immutable SHA + convenience latest)
        id: image
        run: |
          REPO_LOWER="${{ github.repository }}"
          REPO_LOWER="${REPO_LOWER,,}"
          SHA="${{ github.sha }}"
          echo "ref=ghcr.io/${REPO_LOWER}:sha-${SHA}"       >>"$GITHUB_OUTPUT"
          # convenience tag — never used as the deployment source
          echo "latest=ghcr.io/${REPO_LOWER}:latest"        >>"$GITHUB_OUTPUT"
          echo "sha=${SHA}"                                  >>"$GITHUB_OUTPUT"
          echo "configured image: ghcr.io/${REPO_LOWER}:sha-${SHA}"

      - name: Log in to GHCR (for push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image to GHCR (immutable SHA + convenience latest)
        # Pushed in ONE BuildKit operation (push: true) so BOTH tags land on
        # GHCR. The image is NOT loaded into the runner's local daemon, so a
        # later `docker tag`/`docker push` would fail — avoid that entirely.
        # The sha-<commit> tag is the immutable version actually deployed; the
        # `latest` tag is a convenience pointer only.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ steps.image.outputs.latest }}
          labels: |
            org.opencontainers.image.title=tofan-cloud
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # JOB 3 — deploy-production
  # Runs ONLY for push to main and workflow_dispatch (never for pull_request).
  # Bound to the 'production' GitHub Environment so its secrets are exposed.
  # ==========================================================================
  deploy-production:
    name: Deploy to production over SSH (with rollback)
    needs: build-push
    runs-on: ubuntu-latest
    # Bind to the 'production' GitHub Environment so its environment-level
    # secrets (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS,
    # GHCR_USERNAME/GHCR_TOKEN) are exposed to this job.
    environment: production
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout (for deploy scripts)
        uses: actions/checkout@v4

      - name: Validate required SSH secrets
        env:
          H: ${{ secrets.DEPLOY_HOST }}
          U: ${{ secrets.DEPLOY_USER }}
          K: ${{ secrets.DEPLOY_SSH_KEY }}
          KH: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ -n "$H" ]]  || { echo "::error::DEPLOY_HOST is not set"; exit 1; }
          [[ -n "$U" ]]  || { echo "::error::DEPLOY_USER is not set"; exit 1; }
          [[ -n "$K" ]]  || { echo "::error::DEPLOY_SSH_KEY is not set"; exit 1; }
          [[ -n "$KH" ]] || { echo "::error::DEPLOY_KNOWN_HOSTS is not set"; exit 1; }
          # GHCR auth is optional: only the pushing side needs write; the puller
          # can use a PUBLIC package, or GHCR_USERNAME/GHCR_TOKEN (read:packages)
          # for a PRIVATE package. They are validated & installed below if present.
          echo "All required SSH deploy secrets present."

      - name: Write SSH config (key + known_hosts)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          [[ -n "$DEPLOY_SSH_KEY" ]] || { echo "::error::DEPLOY_SSH_KEY is empty"; exit 1; }
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Preconfigured known_hosts — NO ssh-keyscan, NO StrictHostKeyChecking=no.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null   # validate it's a real key
          echo "SSH key + known_hosts written and validated."

      - name: Install deploy script on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          SSHCOMMON="-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i ~/.ssh/deploy_key"
          ssh ${SSHCOMMON} -p "${PORT}" "${TARGET}" "mkdir -p /opt/tofan/cloud/scripts"
          scp ${SSHCOMMON} -P "${PORT}" deploy/scripts/deploy.sh "${TARGET}:/opt/tofan/cloud/scripts/deploy.sh"
          ssh ${SSHCOMMON} -p "${PORT}" "${TARGET}" "chmod +x /opt/tofan/cloud/scripts/deploy.sh && rm -f /opt/tofan/cloud/.ghcr.env && echo 'deploy.sh installed'"

      - name: Detect GHCR auth dependencies (PRIVATE package only)
        # GitHub Actions does NOT allow `secrets` in an `if:` conditional, and a
        # step's own `env` is unavailable to that same step's `if:` (it is
        # evaluated first). So we detect secret presence here and expose a plain
        # boolean output, then gate the next step on that output. This keeps
        # GHCR_TOKEN scoped to exactly one step and never prints it.
        id: ghcr_auth
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -n "$GHCR_USERNAME" ]]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
            echo "GHCR package is PRIVATE: authenticated pull will be configured."
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "No GHCR credentials configured; assuming a PUBLIC GHCR package."
          fi

      - name: Install GHCR credentials on server (PRIVATE package only)
        # Runs only when the detection step above found GHCR_USERNAME set.
        # GHCR_TOKEN is written to a temporary 0600 file, used for an
        # authenticated `docker login` by deploy.sh, then removed. The token
        # value is never echoed.
        if: ${{ steps.ghcr_auth.outputs.required == 'true' }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          SSHCOMMON="-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -i ~/.ssh/deploy_key"
          printf 'GHCR_USERNAME=%s\nGHCR_TOKEN=%s\n' "$GHCR_USERNAME" "$GHCR_TOKEN" > "$RUNNER_TEMP/.ghcr.env"
          chmod 600 "$RUNNER_TEMP/.ghcr.env"
          scp ${SSHCOMMON} -P "${PORT}" "$RUNNER_TEMP/.ghcr.env" "${TARGET}:/opt/tofan/cloud/.ghcr.env"
          ssh ${SSHCOMMON} -p "${PORT}" "${TARGET}" "chmod 600 /opt/tofan/cloud/.ghcr.env && echo 'ghcr creds staged on server (removed after deploy)'"

      - name: Run deploy (with automatic rollback)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ needs.build-push.outputs.image }}
          SHA: ${{ needs.build-push.outputs.sha }}
          SKIP: ${{ inputs.skip_public_healthcheck }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          TARGET="${DEPLOY_USER}@${DEPLOY_HOST}"
          SKIP_PUBLIC="${SKIP:-false}"
          # bootstrap-only flag; strict (0) is the default for all other runs
          if [[ "$SKIP_PUBLIC" == "true" ]]; then
            FLAG='SKIP_PUBLIC_HEALTHCHECK=1'
            echo "NOTE: SKIP_PUBLIC_HEALTHCHECK=1 (initial bootstrap) — public checks skipped."
          else
            FLAG='SKIP_PUBLIC_HEALTHCHECK=0'
          fi
          echo "Deploying image: ${IMAGE} (sha ${SHA})"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=30 -i ~/.ssh/deploy_key \
              -p "${PORT}" \
              "${TARGET}" \
              "set -a && source /opt/tofan/cloud/.ghcr.env 2>/dev/null || true; set +a; \
               COMPOSE_DIR=/opt/tofan/cloud CLOUD_PORT=8540 ${FLAG} \
               bash /opt/tofan/cloud/scripts/deploy.sh '${IMAGE}' 'https://cloud.tofanservice.ir'; \
               rc=\$?; rm -f /opt/tofan/cloud/.ghcr.env; exit \$rc"